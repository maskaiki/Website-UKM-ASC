<!-- =====================================================================
  UKM ASC UNIVERSITAS NEGERI MALANG - SECTION 00: HEADER & NAVBAR FLOATING
  Cara Penggunaan di WordPress (Elementor / Divi):
  1. Buka widget "Text Editor" (pilih tab 'Text' / 'Code') ATAU widget "Custom HTML".
  2. Copy semua isi file ini (Ctrl+A -> Ctrl+C), lalu paste (Ctrl+V).
  3. Desain sudah mandiri (Self-Contained) lengkap dengan CSS, HTML, & JS Mobile Menu.
====================================================================== -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

  /* SCOPED WRAPPER HEADER */
  #asc-header-navbar {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #1e293b;
    position: relative;
    z-index: 9999;
    width: 100%;
  }

  #asc-header-navbar * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* MAIN NAVBAR - FLOATING GLASSMORPHISM */
  #asc-header-navbar .asc-nav-main {
    max-width: 1200px;
    margin: 16px auto 0;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 60px;
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.06),
      0 1px 2px rgba(0, 0, 0, 0.04),
      inset 0 1px 0 rgba(255, 255, 255, 0.8);
    position: relative;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #asc-header-navbar .asc-nav-main:hover {
    box-shadow:
      0 12px 40px rgba(0, 0, 0, 0.08),
      0 1px 3px rgba(0, 0, 0, 0.05),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  /* BRAND / LOGO */
  #asc-header-navbar .asc-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }
  #asc-header-navbar .asc-brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: -0.02em;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
    transition: transform 0.3s ease;
  }
  #asc-header-navbar .asc-brand:hover .asc-brand-icon {
    transform: rotate(-8deg) scale(1.08);
  }
  #asc-header-navbar .asc-brand-name {
    font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.03em;
  }

  /* DESKTOP MENU LINKS */
  #asc-header-navbar .asc-menu-list {
    display: flex;
    align-items: center;
    gap: 6px;
    list-style: none;
  }
  #asc-header-navbar .asc-nav-link {
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    color: #334155;
    padding: 8px 16px;
    border-radius: 999px;
    letter-spacing: -0.01em;
    transition: all 0.2s ease;
    display: inline-block;
  }
  #asc-header-navbar .asc-nav-link:hover {
    color: #0ea5e9;
    background: rgba(14, 165, 233, 0.08);
  }

  /* CTA BUTTON - NEON GREEN STYLE LIKE AELINE */
  #asc-header-navbar .asc-nav-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    background: #0f172a;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    border-radius: 999px;
    text-decoration: none;
    letter-spacing: -0.01em;
    border: 1.5px solid #0f172a;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #asc-header-navbar .asc-nav-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
    background: #1e293b;
  }
  #asc-header-navbar .asc-cta-arrow {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #a3e635;
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* MOBILE HAMBURGER */
  #asc-header-navbar .asc-hamburger {
    display: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    padding: 0;
    transition: all 0.3s ease;
  }
  #asc-header-navbar .asc-hamburger span {
    display: block;
    width: 18px;
    height: 2px;
    background: #0f172a;
    border-radius: 2px;
    transition: all 0.3s ease;
  }
  #asc-header-navbar .asc-hamburger.asc-open span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }
  #asc-header-navbar .asc-hamburger.asc-open span:nth-child(2) {
    opacity: 0;
  }
  #asc-header-navbar .asc-hamburger.asc-open span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  /* MOBILE DRAWER */
  #asc-header-navbar .asc-mobile-drawer {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 12px;
    right: 12px;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(226, 232, 240, 0.8);
    border-radius: 24px;
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.12);
    padding: 12px;
    flex-direction: column;
    gap: 4px;
    z-index: 10000;
  }
  #asc-header-navbar .asc-mobile-drawer.asc-open {
    display: flex;
    animation: ascFadeSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes ascFadeSlide {
    from { opacity: 0; transform: translateY(-12px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  #asc-header-navbar .asc-mobile-link {
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    color: #334155;
    padding: 14px 18px;
    border-radius: 14px;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #asc-header-navbar .asc-mobile-link:hover {
    background: #f0f9ff;
    color: #0ea5e9;
  }

  /* RESPONSIVE */
  @media (max-width: 992px) {
    #asc-header-navbar .asc-menu-list { display: none; }
    #asc-header-navbar .asc-nav-cta { display: none; }
    #asc-header-navbar .asc-hamburger { display: flex; }
    #asc-header-navbar .asc-nav-main { margin: 10px 16px 0; padding: 12px 20px; }
  }
  @media (max-width: 640px) {
    #asc-header-navbar .asc-brand-name { font-size: 16px; }
  }
</style>

<!-- =========================================================================
     STRUKTUR HTML SECTION 00: HEADER & NAVBAR FLOATING
     ========================================================================= -->
<div id="asc-header-navbar">
  <header class="asc-nav-main">
    
    <!-- Brand -->
    <a href="#asc-hero-profil" class="asc-brand">
      <div class="asc-brand-icon">ASC</div>
      <span class="asc-brand-name">UKM ASC</span>
    </a>

    <!-- Desktop Nav Links -->
    <ul class="asc-menu-list">
      <li><a href="#asc-hero-profil" class="asc-nav-link">Profil</a></li>
      <li><a href="#asc-visi-misi" class="asc-nav-link">Visi Misi</a></li>
      <li><a href="#asc-struktur" class="asc-nav-link">Struktur</a></li>
      <li><a href="#asc-agenda" class="asc-nav-link">Agenda</a></li>
      <li><a href="#asc-galeri" class="asc-nav-link">Galeri</a></li>
      <li><a href="#asc-prestasi" class="asc-nav-link">Prestasi</a></li>
    </ul>

    <!-- CTA Button (Aeline-Style with arrow badge) -->
    <a href="#asc-kontak" class="asc-nav-cta">
      <span>HUBUNGI KAMI</span>
      <span class="asc-cta-arrow">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
      </span>
    </a>

    <!-- Mobile Hamburger -->
    <button class="asc-hamburger" id="ascHamburgerBtn" onclick="ascToggleMobileMenu()" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Mobile Drawer -->
    <div class="asc-mobile-drawer" id="ascMobileDrawer">
      <a href="#asc-hero-profil" class="asc-mobile-link" onclick="ascCloseMobileMenu()">
        <span>Profil</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </a>
      <a href="#asc-visi-misi" class="asc-mobile-link" onclick="ascCloseMobileMenu()">
        <span>Visi & Misi</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </a>
      <a href="#asc-struktur" class="asc-mobile-link" onclick="ascCloseMobileMenu()">
        <span>Struktur Organisasi</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </a>
      <a href="#asc-agenda" class="asc-mobile-link" onclick="ascCloseMobileMenu()">
        <span>Agenda & Pembinaan</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </a>
      <a href="#asc-galeri" class="asc-mobile-link" onclick="ascCloseMobileMenu()">
        <span>Galeri</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </a>
      <a href="#asc-prestasi" class="asc-mobile-link" onclick="ascCloseMobileMenu()">
        <span>Prestasi</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </a>
      <a href="#asc-kontak" class="asc-mobile-link" onclick="ascCloseMobileMenu()" style="background:#0f172a; color:#fff; border-radius:14px; margin-top:4px;">
        <span>Hubungi Kami</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
      </a>
    </div>

  </header>
</div>

<!-- =========================================================================
     JAVASCRIPT INTERAKTIF (MOBILE MENU TOGGLE)
     ========================================================================= -->
<script>
  function ascToggleMobileMenu() {
    document.getElementById('ascHamburgerBtn').classList.toggle('asc-open');
    document.getElementById('ascMobileDrawer').classList.toggle('asc-open');
  }
  function ascCloseMobileMenu() {
    document.getElementById('ascHamburgerBtn').classList.remove('asc-open');
    document.getElementById('ascMobileDrawer').classList.remove('asc-open');
  }
  document.addEventListener('click', function(e) {
    var nav = document.getElementById('asc-header-navbar');
    if (nav && !nav.contains(e.target)) ascCloseMobileMenu();
  });
</script>
