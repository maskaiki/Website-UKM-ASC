<!-- =====================================================================
  UKM ASC UNIVERSITAS NEGERI MALANG - SECTION 05: 10 PEMBINAAN (SCROLL STORY)
  Cara pakai di WordPress (Elementor / Divi):
  1. Taruh widget "Custom HTML" di container FULL WIDTH.
  2. Paste seluruh isi file ini.
  3. Ganti gambar: cari "DAFTAR PEMBINAAN" di bawah, isi bagian img:'' dengan URL gambar.
  CATATAN: efek "menempel saat scroll" (sticky) tidak jalan jika ada parent
  dengan overflow:hidden. Di Elementor: Container > Advanced > Overflow = Default.
====================================================================== -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  #asc-pb {
    --blue: #0284c7;
    --royal: #2563eb;
    --ink: #0f172a;
    --muted: #64748b;
    --p: 0;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    position: relative;
    height: 520vh;
    width: 100%;
  }

  #asc-pb * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  #asc-pb .pb-stage {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: clip;
    background: #fff;
  }

  #asc-pb .pb-wash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, #bae0f7 0%, #e0f2fe 45%, #fff 100%);
    opacity: 0;
  }

  /* Judul tetap di tempat */
  #asc-pb .pb-head {
    position: absolute;
    left: 0;
    right: 0;
    top: 15vh;
    text-align: center;
    padding: 0 20px;
    z-index: 1;
  }

  #asc-pb .pb-title {
    font-size: clamp(34px, 6vw, 84px);
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -.03em;
  }

  #asc-pb .pb-uline {
    display: block;
    width: min(46vw, 380px);
    height: 22px;
    margin: 6px auto 0;
    overflow: visible;
  }

  #asc-pb .pb-uline path {
    fill: none;
    stroke: #bae0f7;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #asc-pb .pb-sub {
    margin: 14px auto 0;
    max-width: 520px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
  }

  /* Jalur kartu */
  #asc-pb .pb-track {
    position: absolute;
    left: 0;
    top: 42vh;
    display: flex;
    gap: 28px;
    padding: 0 4vw;
    will-change: transform;
    z-index: 2;
  }

  #asc-pb .pb-card {
    flex: 0 0 clamp(270px, 30vw, 440px);
    background: #fff;
    border-radius: 20px;
    padding: 12px 12px 20px;
    box-shadow: 0 18px 40px -14px rgba(2, 60, 110, .28), 0 2px 6px rgba(2, 60, 110, .08);
    will-change: transform;
    transform-origin: 50% 100%;
  }

  #asc-pb .pb-img {
    position: relative;
    aspect-ratio: 16/10;
    border-radius: 12px;
    background: #eef6fc center/cover no-repeat;
    overflow: hidden;
  }

  #asc-pb .pb-img.pb-ph {
    background-image: linear-gradient(135deg, #f8fbff 0%, #e3f1fb 100%);
  }

  #asc-pb .pb-ph::after {
    content: attr(data-n);
    position: absolute;
    right: 14px;
    bottom: -18px;
    font-size: 120px;
    font-weight: 800;
    color: rgba(2, 132, 199, .09);
    line-height: 1;
  }

  #asc-pb .pb-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(224, 242, 254, .95);
    color: #0369a1;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 999px;
  }

  #asc-pb .pb-card h3 {
    font-size: clamp(18px, 1.6vw, 23px);
    font-weight: 800;
    letter-spacing: -.01em;
    margin: 16px 6px 8px;
    line-height: 1.25;
  }

  #asc-pb .pb-card p {
    font-size: 14px;
    line-height: 1.65;
    color: var(--muted);
    margin: 0 6px 18px;
    min-height: 5.3em;
  }

  #asc-pb .pb-row {
    display: flex;
    gap: 8px;
    margin: 0 6px;
  }

  #asc-pb .pb-btn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    padding: 12px 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, #0284c7, #2563eb);
    transition: filter .2s;
  }

  #asc-pb .pb-btn:hover {
    filter: brightness(1.1);
  }

  #asc-pb .pb-btn:focus-visible,
  #asc-pb .pb-go:focus-visible {
    outline: 3px solid #0f172a;
    outline-offset: 2px;
  }

  #asc-pb .pb-go {
    width: 44px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: #e0f2fe;
    color: #0369a1;
    text-decoration: none;
    font-weight: 800;
  }

  /* Penanda progres */
  #asc-pb .pb-prog {
    position: absolute;
    left: 50%;
    bottom: 6vh;
    transform: translateX(-50%);
    width: min(360px, 70vw);
    z-index: 3;
    text-align: center;
  }

  #asc-pb .pb-count {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }

  #asc-pb .pb-bar {
    height: 4px;
    border-radius: 4px;
    background: rgba(15, 23, 42, .1);
    overflow: hidden;
  }

  #asc-pb .pb-bar i {
    display: block;
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #0284c7, #2563eb);
    transform-origin: 0 50%;
    transform: scaleX(var(--p));
  }

  /* Gerak dikurangi: daftar geser biasa */
  #asc-pb.pb-static {
    height: auto;
    padding: 60px 0;
  }

  #asc-pb.pb-static .pb-stage {
    position: relative;
    height: auto;
    overflow: visible;
  }

  #asc-pb.pb-static .pb-head {
    position: relative;
    top: 0;
    margin-bottom: 30px;
  }

  #asc-pb.pb-static .pb-track {
    position: relative;
    top: 0;
    transform: none !important;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 20px;
  }

  #asc-pb.pb-static .pb-card {
    transform: none !important;
    scroll-snap-align: center;
  }

  #asc-pb.pb-static .pb-prog,
  #asc-pb.pb-static .pb-wash {
    display: none;
  }

  @media (max-width:640px) {
    #asc-pb .pb-head {
      top: 11vh;
    }

    #asc-pb .pb-sub {
      font-size: 13px;
    }

    #asc-pb .pb-track {
      top: 46vh;
      gap: 18px;
    }

    #asc-pb .pb-card {
      flex-basis: 76vw;
    }

    #asc-pb .pb-card p {
      font-size: 13px;
    }
  }
</style>

<section id="asc-pb" aria-label="10 Bidang Pembinaan UKM ASC">
  <span id="asc-pembinaan" style="position:relative;top:-90px;display:block;visibility:hidden;height:0;width:0;"></span>
  <span id="asc-agenda" style="position:relative;top:-90px;display:block;visibility:hidden;height:0;width:0;"></span>
  <div class="pb-stage">
    <div class="pb-wash"></div>
    <div class="pb-head">
      <h2 class="pb-title">Sepuluh jalan untuk<br>tumbuh bersama Al-Qur'an
        <svg class="pb-uline" viewBox="0 0 380 22" preserveAspectRatio="none" aria-hidden="true">
          <path d="M4 8 C 20 20, 34 20, 40 10 S 70 6, 120 11 S 260 8, 376 9" />
        </svg>
      </h2>
      <p class="pb-sub">Bidang pembinaan rutin UKM ASC Universitas Negeri Malang, dari memperbaiki bacaan hingga
        berkarya.</p>
    </div>
    <div class="pb-track" id="pbTrack"></div>
    <div class="pb-prog" aria-hidden="true">
      <div class="pb-count" id="pbCount">1 dari 10</div>
      <div class="pb-bar"><i></i></div>
    </div>
  </div>
</section>

<script>
  (function () {
    /* ============ DAFTAR PEMBINAAN (ganti img:'' dengan URL gambar, link:'#' dengan URL tujuan) ============ */
    var DATA = [
      { t: "Tahsinul Qiro’ah", d: "Penyempurnaan makharijul huruf, sifat huruf, dan kaidah tajwid dasar hingga mahir agar bacaan Al-Qur'an tepat dan fasih.", img: '', link: '#' },
      { t: "Tartilul Qur’an", d: "Pembinaan membaca Al-Qur'an secara perlahan, teratur, memperhatikan waqaf wal ibtida', serta penghayatan makna ayat.", img: '', link: '#' },
      { t: "Tilawatul Qur’an", d: "Pelatihan seni baca Al-Qur'an dengan keindahan maqam lagu (Bayati, Shoba, Hijaz, Nahawand, Rast, Sika, Jiharkah).", img: '', link: '#' },
      { t: "Tahfidhul Qur’an", d: "Program bimbingan menghafal Al-Qur'an, setor hafalan (tasmi'), dan muraja'ah rutin untuk menjaga hafalan kalamullah.", img: '', link: '#' },
      { t: "Syarhul Qur’an", d: "Pembinaan seni orasi dan syiar Al-Qur'an dalam format tim (pensyarah, qari'/qari'ah, dan sari tilawah) mengangkat isu kontemporer.", img: '', link: '#' },
      { t: "Fahmul Qur’an", d: "Cerdas cermat ke-Al-Qur'an-an yang mendalami wawasan tafsir, ulumul Qur'an, hadis, fiqih, sirah nabawiyah, dan bahasa Arab.", img: '', link: '#' },
      { t: "Khaththul Qur’an (Kaligrafi)", d: "Pelatihan seni rupa kaligrafi Islam (Naskhi, Tsuluts, Riq'ah, Diwani, Kufi) dalam bidang naskah, hiasan mushaf, dan dekorasi.", img: '', link: '#' },
      { t: "Karya Tulis Ilmiah Al-Qur'an (KTIA)", d: "Bimbingan penulisan karya ilmiah yang mengintegrasikan Al-Qur'an dengan solusi sains, teknologi, dan isu sosial kemasyarakatan.", img: '', link: '#' },
      { t: "Desain Aplikasi Al-Qur'an", d: "Pengembangan kreativitas mahasiswa dalam merancang inovasi UI/UX, aplikasi edukasi, dan platform digital berbasis Al-Qur'an.", img: '', link: '#' },
      { t: "Maulid Nabi & Peringatan PHBI", d: "Pembinaan seni rebana/hadrah shalawat, kepanitiaan hari besar Islam, dan semarak syiar dakwah di kampus Universitas Negeri Malang.", img: '', link: '#' }
    ];
    /* ======================================================================================================== */

    var root = document.getElementById('asc-pb'), track = document.getElementById('pbTrack'),
      countEl = document.getElementById('pbCount'), wash = root.querySelector('.pb-wash'), line = root.querySelector('.pb-uline path');
    var h = '';
    DATA.forEach(function (x, i) {
      var n = ('0' + (i + 1)).slice(-2), bg = x.img ? ' style="background-image:url(\'' + x.img + '\')"' : '', ph = x.img ? '' : ' pb-ph';
      h += '<article class="pb-card"><div class="pb-img' + ph + '" data-n="' + n + '" role="img" aria-label="' + x.t + '"' + bg + '><span class="pb-badge">Pembinaan rutin</span></div>' +
        '<h3>' + x.t + '</h3><p>' + x.d + '</p><div class="pb-row"><a class="pb-btn" href="' + x.link + '">Selengkapnya</a><a class="pb-go" href="' + x.link + '" aria-label="Buka ' + x.t + '">&rarr;</a></div></article>';
    });
    track.innerHTML = h;
    var cards = [].slice.call(track.children), vw, vh, trackW, startX, endX, ticking = false;

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { root.classList.add('pb-static'); return; }

    function measure() {
      vw = window.innerWidth; vh = window.innerHeight; trackW = track.scrollWidth;
      startX = vw * 0.92; endX = -(trackW - vw * 0.78);
      root.style.height = (vh + (startX - endX) * 0.85) + 'px';
      update();
    }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function update() {
      ticking = false;
      var r = root.getBoundingClientRect(), total = root.offsetHeight - vh;
      var p = Math.min(1, Math.max(0, -r.top / total));
      root.style.setProperty('--p', p);
      var x = lerp(startX, endX, p);
      track.style.transform = 'translate3d(' + x + 'px,0,0)';
      wash.style.opacity = Math.min(1, Math.sin(Math.PI * Math.min(1, p * 1.08)) * 1.25);
      var c = Math.min(1, p * 6);
      line.style.stroke = 'rgb(' + Math.round(lerp(186, 15, c)) + ',' + Math.round(lerp(224, 23, c)) + ',' + Math.round(lerp(247, 42, c)) + ')';
      var best = 0, bd = 1e9;
      cards.forEach(function (el, i) {
        var b = el.getBoundingClientRect(), cx = b.left + b.width / 2, off = (cx - vw / 2) / vw;
        var rot = (i % 2 ? 1 : -1) * 2.6 + off * 5, y = Math.sin(i * 1.7) * 14 + Math.abs(off) * 18;
        el.style.transform = 'translate3d(0,' + y + 'px,0) rotate(' + rot + 'deg)';
        var d = Math.abs(off); if (d < bd) { bd = d; best = i; }
      });
      countEl.textContent = (best + 1) + ' dari ' + cards.length;
    }
    function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', measure);
    window.addEventListener('load', measure);
    measure();
  })();
</script>
