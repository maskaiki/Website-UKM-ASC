<!-- =====================================================================
  UKM ASC UNIVERSITAS NEGERI MALANG — SECTION 00: HEADER (STANDALONE DIVI)
  100% Mandiri dalam 1 file (HTML + CSS + JS opsional, tanpa file/Python lain).
  Cara pakai di WordPress Divi Builder:
  1. Buka modul "Code" / "Fullwidth Code" di section paling atas halaman.
  2. Salin seluruh isi file ini (Ctrl+A -> Ctrl+C), lalu tempel (Ctrl+V).
  Catatan Teknis:
  - Normal flow (tanpa position: fixed / sticky) agar tidak tertutup di belakang
    section lain di WordPress / Divi Builder.
  - Tombol Menu / Titik 3 berjalan dengan Pure HTML + CSS checkbox (:checked),
    membuka panel menu langsung di dalam aliran dokumen sehingga selalu tampil
    utuh di depan tanpa terpotong overflow section.
====================================================================== -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  /* Header bersifat statis/normal di atas, beri tahu section sticky lain bahwa offset fixed = 0 */
  :root {
    --asc-hh: 0px !important;
  }

  /* Smooth scroll murni HTML + CSS saat tautan menu diklik */
  html {
    scroll-behavior: smooth;
  }

  /* Bersihkan padding & pembatas lebar bawaan Divi/Elementor khusus section header */
  .et_pb_section:has(#asc-hdr),
  .et_pb_section:has(#asc-hdr) .et_pb_row,
  .et_pb_section:has(#asc-hdr) .et_pb_column,
  .et_pb_section:has(#asc-hdr) .et_pb_code,
  .et_pb_section:has(#asc-hdr) .et_pb_code_inner,
  .elementor-section:has(#asc-hdr),
  .elementor-element:has(#asc-hdr) {
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: visible !important;
    position: relative !important;
    z-index: 50 !important;
  }

  /* Karena header berada pada alur normal (tidak melayang fixed), rapikan jarak atas Hero */
  .hero-o3-shell {
    padding-top: clamp(16px, 2.2vw, 28px) !important;
  }

  /* Reset terisolasi agar kebal dari CSS bawaan tema WordPress / Divi */
  #asc-hdr,
  #asc-hdr *,
  #asc-hdr *::before,
  #asc-hdr *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  #asc-hdr {
    position: relative !important;
    display: block !important;
    width: 100% !important;
    z-index: 50 !important;
    background: #f6f5f0;
    color: #09131c;
    border-bottom: 1px solid rgba(9, 19, 28, 0.10);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  #asc-hdr a {
    color: inherit !important;
    text-decoration: none !important;
    box-shadow: none !important;
    border-bottom-color: transparent;
  }

  /* Baris utama header (Normal Flow, tanpa sticky/fixed) */
  #asc-hdr .asc-hdr-bar {
    max-width: 1440px;
    margin: 0 auto;
    min-height: 76px;
    padding: 12px clamp(20px, 4vw, 56px);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
  }

  /* Identitas Brand */
  #asc-hdr .asc-brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    justify-self: start;
  }

  #asc-hdr .asc-brand-logo {
    font-family: 'Geist', 'Plus Jakarta Sans', sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.045em;
    line-height: 1;
    color: #09131c;
  }

  #asc-hdr .asc-brand-logo span {
    color: #0d5c3f;
  }

  #asc-hdr .asc-brand-sep {
    width: 1px;
    height: 24px;
    background: rgba(9, 19, 28, 0.20);
    flex-shrink: 0;
  }

  #asc-hdr .asc-brand-sub {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.25;
    color: #273545;
  }

  /* Navigasi Desktop Tengah */
  #asc-hdr .asc-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  #asc-hdr .asc-nav-link {
    position: relative;
    display: inline-block;
    font-size: 14px;
    font-weight: 600;
    color: #273545 !important;
    padding: 6px 0;
    white-space: nowrap;
    transition: color 0.18s ease;
  }

  #asc-hdr .asc-nav-link::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 1.5px;
    background: #0d5c3f;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.22s cubic-bezier(0.22, 0.31, 0, 1);
  }

  #asc-hdr .asc-nav-link:hover {
    color: #09131c !important;
  }

  #asc-hdr .asc-nav-link:hover::after {
    transform: scaleX(1);
  }

  /* Tombol Menu / Titik 3 (Pure HTML + CSS Checkbox Trigger) */
  #asc-hdr .asc-hdr-right {
    justify-self: end;
    display: flex;
    align-items: center;
  }

  #asc-hdr .asc-hdr-cb {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
  }

  #asc-hdr .asc-menu-trigger {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 40px;
    padding: 0 14px 0 16px;
    border-radius: 8px;
    border: 1.5px solid rgba(9, 19, 28, 0.22);
    background: #ffffff;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    color: #09131c;
    cursor: pointer;
    user-select: none;
    line-height: 1;
    transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.12s ease;
  }

  #asc-hdr .asc-menu-trigger:hover {
    background: #09131c;
    border-color: #09131c;
    color: #ffffff;
  }

  #asc-hdr .asc-menu-trigger:active {
    transform: scale(0.97);
  }

  #asc-hdr .asc-hdr-cb:focus-visible ~ .asc-hdr-bar .asc-menu-trigger {
    outline: 2px solid #0d5c3f;
    outline-offset: 2px;
  }

  /* Ikon Titik 3 */
  #asc-hdr .asc-dots-icon {
    display: inline-flex;
    align-items: center;
    gap: 3.5px;
  }

  #asc-hdr .asc-dots-icon i {
    display: block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: currentColor;
  }

  #asc-hdr .asc-menu-label-close,
  #asc-hdr .asc-close-x {
    display: none;
  }

  /* Kondisi saat Titik 3 / Menu diklik (tercentang) */
  #asc-hdr .asc-hdr-cb:checked ~ .asc-hdr-bar .asc-menu-trigger {
    background: #09131c;
    border-color: #09131c;
    color: #ffffff;
  }

  #asc-hdr .asc-hdr-cb:checked ~ .asc-hdr-bar .asc-menu-label-open,
  #asc-hdr .asc-hdr-cb:checked ~ .asc-hdr-bar .asc-dots-icon {
    display: none;
  }

  #asc-hdr .asc-hdr-cb:checked ~ .asc-hdr-bar .asc-menu-label-close,
  #asc-hdr .asc-hdr-cb:checked ~ .asc-hdr-bar .asc-close-x {
    display: inline-block;
    font-size: 14px;
  }

  /* =====================================================================
     PANEL MENU EKSPANSIF (PURE HTML + CSS IN-FLOW)
     Mengembang rapi langsung di dalam header agar SELALU terlihat di depan
     dan tidak akan pernah tertindih / tertutup oleh section di bawahnya.
  ====================================================================== */
  #asc-hdr .asc-drawer {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    background: #09131c;
    color: #ffffff;
    border-top: 0 solid rgba(255, 255, 255, 0.12);
    transition: grid-template-rows 0.32s cubic-bezier(0.22, 0.31, 0, 1), opacity 0.24s ease;
  }

  #asc-hdr .asc-hdr-cb:checked ~ .asc-drawer {
    grid-template-rows: 1fr;
    opacity: 1;
    border-top-width: 1px;
  }

  #asc-hdr .asc-drawer-clip {
    overflow: hidden;
  }

  #asc-hdr .asc-drawer-inner {
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px clamp(20px, 4vw, 56px) 28px;
  }

  #asc-hdr .asc-drawer-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 40px;
  }

  #asc-hdr .asc-drawer-link {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 15px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.14) !important;
    font-family: 'Geist', 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(19px, 2.2vw, 28px);
    font-weight: 700;
    letter-spacing: -0.025em;
    color: #ffffff !important;
    transition: padding-left 0.22s cubic-bezier(0.22, 0.31, 0, 1), color 0.18s ease, border-color 0.18s ease;
  }

  #asc-hdr .asc-drawer-link:hover {
    padding-left: 12px;
    color: #10b981 !important;
    border-bottom-color: rgba(16, 185, 129, 0.5) !important;
  }

  #asc-hdr .asc-drawer-num {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #10b981;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  #asc-hdr .asc-drawer-foot {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.10);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 13.5px;
    color: rgba(246, 245, 240, 0.72);
  }

  #asc-hdr .asc-drawer-close-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    color: #ffffff;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.16s, color 0.16s;
  }

  #asc-hdr .asc-drawer-close-link:hover {
    background: #ffffff;
    color: #09131c;
  }

  @media (max-width: 1024px) {
    #asc-hdr .asc-nav {
      display: none;
    }

    #asc-hdr .asc-hdr-bar {
      grid-template-columns: 1fr auto;
    }
  }

  @media (max-width: 720px) {
    #asc-hdr .asc-hdr-bar {
      min-height: 64px;
      padding: 10px 16px;
    }

    #asc-hdr .asc-brand-sep,
    #asc-hdr .asc-brand-sub {
      display: none;
    }

    #asc-hdr .asc-drawer-inner {
      padding: 18px 16px 22px;
    }

    #asc-hdr .asc-drawer-grid {
      grid-template-columns: 1fr;
      gap: 2px;
    }

    #asc-hdr .asc-drawer-link {
      font-size: 18px;
      padding: 13px 2px;
    }
  }
</style>

<!-- ======================== CLEAN STANDALONE EDITORIAL HEADER ======================== -->
<header id="asc-hdr" aria-label="Navigasi Utama UKM ASC">
  <input type="checkbox" id="ascMenuCb" class="asc-hdr-cb" aria-label="Tampilkan atau sembunyikan menu navigasi" />

  <div class="asc-hdr-bar">
    <a href="#top" class="asc-brand">
      <div class="asc-brand-logo">ASC<span>.</span></div>
      <div class="asc-brand-sep" aria-hidden="true"></div>
      <div class="asc-brand-sub">Al-Qur'an<br />Study Club UM</div>
    </a>

    <nav class="asc-nav" aria-label="Navigasi Utama">
      <a href="#asc-visi-misi" class="asc-nav-link">Visi Misi</a>
      <a href="#asc-pembinaan" class="asc-nav-link">Pembinaan</a>
      <a href="#asc-struktur" class="asc-nav-link">Struktur</a>
      <a href="#prestasi" class="asc-nav-link">Prestasi</a>
      <a href="#kabinet" class="asc-nav-link">Kabinet</a>
    </nav>

    <div class="asc-hdr-right">
      <label for="ascMenuCb" class="asc-menu-trigger" tabindex="0" aria-label="Buka atau tutup menu navigasi">
        <span class="asc-menu-label-open">Menu</span>
        <span class="asc-dots-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="asc-menu-label-close">Tutup</span>
        <span class="asc-close-x" aria-hidden="true">✕</span>
      </label>
    </div>
  </div>

  <!-- Panel Menu Navigasi Lengkap (Mengembang langsung tanpa menutupi/tertutup section) -->
  <div class="asc-drawer" aria-label="Daftar Menu Navigasi">
    <div class="asc-drawer-clip">
      <div class="asc-drawer-inner">
        <div class="asc-drawer-grid">
          <a href="#asc-visi-misi" class="asc-drawer-link"><span class="asc-drawer-num">01</span><span>Visi &amp; Misi</span></a>
          <a href="#asc-pembinaan" class="asc-drawer-link"><span class="asc-drawer-num">02</span><span>10 Bidang Pembinaan</span></a>
          <a href="#asc-struktur" class="asc-drawer-link"><span class="asc-drawer-num">03</span><span>Struktur Organisasi</span></a>
          <a href="#prestasi" class="asc-drawer-link"><span class="asc-drawer-num">04</span><span>Jejak Prestasi (42)</span></a>
          <a href="#kabinet" class="asc-drawer-link"><span class="asc-drawer-num">05</span><span>Departemen &amp; Kabinet</span></a>
          <a href="#gabung" class="asc-drawer-link"><span class="asc-drawer-num">06</span><span>Daftar &amp; Kontak</span></a>
        </div>

        <div class="asc-drawer-foot">
          <span>Kompleks Masjid Al-Hikmah · Universitas Negeri Malang · @ukm_asc_um</span>
          <label for="ascMenuCb" class="asc-drawer-close-link">Tutup Menu ✕</label>
        </div>
      </div>
    </div>
  </div>
</header>

<script>
  /* Penunjang opsional mandiri: tutup menu otomatis saat link diklik & kelancaran scroll Divi */
  (function () {
    'use strict';

    try {
      document.documentElement.style.setProperty('--asc-hh', '0px');
    } catch (_) {}

    var hdr = document.getElementById('asc-hdr');
    if (!hdr) return;
    var cb = document.getElementById('ascMenuCb');
    var trigger = hdr.querySelector('.asc-menu-trigger');

    /* Dukungan keyboard Enter / Spasi untuk label checkbox */
    if (trigger && cb) {
      trigger.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          cb.checked = !cb.checked;
        }
      });
    }

    /* Tutup menu jika menekan Escape */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && cb && cb.checked) {
        cb.checked = false;
      }
    });

    /* Pemetaan fallback ID target agar tautan tetap akurat di semua variasi embed Divi */
    var FALLBACK_TARGETS = {
      '#asc-visi-misi': ['#asc-visi-misi', '#asc-vm'],
      '#asc-pembinaan': ['#asc-pb', '#asc-pembinaan'],
      '#asc-struktur': ['#asc-struktur'],
      '#prestasi': ['#prestasi', '#asc-prestasi', '#galeri'],
      '#kabinet': ['#kabinet'],
      '#gabung': ['#gabung', '#faq', '#asc-kontak']
    };

    hdr.addEventListener('click', function (e) {
      var link = e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!link) return;

      /* Selalu tutup panel menu titik 3 setelah memilih tujuan */
      if (cb) cb.checked = false;

      var href = link.getAttribute('href');
      if (!href) return;

      if (href === '#top') {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      var candidates = FALLBACK_TARGETS[href] || [href];
      var targetEl = null;
      for (var i = 0; i < candidates.length; i++) {
        var found = document.querySelector(candidates[i]);
        if (found) {
          targetEl = found;
          break;
        }
      }

      if (targetEl) {
        e.preventDefault();
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        try {
          history.replaceState(null, '', href);
        } catch (_) {}
      }
    });
  })();
</script>
