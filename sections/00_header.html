<!-- =====================================================================
  UKM ASC UM - SECTION 00: HEADER FIXED EDITORIAL (STANDALONE DIVI)
  100% Mandiri dalam 1 file, ringan, dan ramah firewall ModSecurity WordPress.
====================================================================== -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  :root {
    --asc-hh: 76px;
  }

  html {
    scroll-behavior: smooth;
    overflow-x: clip !important;
  }

  body {
    overflow-x: clip !important;
  }

  /* Fix overflow Divi & Elementor agar fixed/sticky berjalan lancar */
  .et_pb_section,
  .et_pb_fullwidth_section,
  .et_pb_row,
  .et_pb_column,
  .et_pb_module,
  .et_pb_code,
  .et_pb_fullwidth_code,
  .et_pb_code_inner,
  .elementor-section,
  .elementor-column,
  .elementor-widget-wrap,
  .elementor-widget,
  .elementor-element {
    overflow: visible !important;
  }

  .et_pb_section:has(#asc-hdr),
  .et_pb_section:has(#asc-hdr) .et_pb_row,
  .et_pb_section:has(#asc-hdr) .et_pb_column,
  .et_pb_section:has(#asc-hdr) .et_pb_module,
  .et_pb_section:has(#asc-hdr) .et_pb_code_inner {
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    position: relative !important;
    z-index: 9000 !important;
    transform: none !important;
  }

  .hero-o3-shell {
    padding-top: clamp(14px, 2vw, 24px) !important;
    min-height: calc(100svh - var(--asc-hh, 76px)) !important;
  }

  .asc-hdr-spacer {
    display: block !important;
    width: 100% !important;
    height: 76px !important;
    background: #f6f5f0;
    pointer-events: none;
  }

  #asc-hdr,
  #asc-hdr *,
  #asc-hdr *::before,
  #asc-hdr *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  #asc-hdr {
    position: fixed !important;
    top: 0;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    z-index: 9000 !important;
    display: block !important;
    background: rgba(246, 245, 240, 0.96);
    color: #09131c;
    border-bottom: 1px solid rgba(9, 19, 28, 0.09);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    transition: background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
  }

  #asc-hdr.is-scrolled {
    background: rgba(255, 255, 255, 0.98);
    border-bottom-color: rgba(9, 19, 28, 0.14);
    box-shadow: 0 8px 28px -8px rgba(9, 19, 28, 0.10);
  }

  body.admin-bar #asc-hdr {
    top: 32px;
  }

  @media screen and (max-width: 782px) {
    body.admin-bar #asc-hdr {
      top: 46px;
    }
  }

  #asc-hdr a {
    color: inherit !important;
    text-decoration: none !important;
    box-shadow: none !important;
  }

  #asc-hdr .asc-scroll-line {
    position: absolute;
    left: 0;
    bottom: -1px;
    height: 2px;
    width: 0%;
    background: #0d5c3f;
    pointer-events: none;
  }

  #asc-hdr .asc-hdr-bar {
    max-width: 1440px;
    margin: 0 auto;
    height: 76px;
    padding: 0 clamp(20px, 4vw, 56px);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
  }

  #asc-hdr .asc-brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    justify-self: start;
  }

  #asc-hdr .asc-brand-logo {
    font-family: 'Geist', 'Plus Jakarta Sans', sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.045em;
    line-height: 1;
    color: #09131c;
  }

  #asc-hdr .asc-brand-logo span {
    color: #0d5c3f;
  }

  #asc-hdr .asc-brand-sep {
    width: 1px;
    height: 24px;
    background: rgba(9, 19, 28, 0.20);
    flex-shrink: 0;
  }

  #asc-hdr .asc-brand-sub {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.25;
    color: #273545;
  }

  #asc-hdr .asc-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  #asc-hdr .asc-nav-link {
    position: relative;
    display: inline-block;
    font-size: 14px;
    font-weight: 600;
    color: #273545 !important;
    padding: 6px 0;
    white-space: nowrap;
    transition: color 0.18s ease;
  }

  #asc-hdr .asc-nav-link::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 1.5px;
    background: #0d5c3f;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.22s cubic-bezier(0.22, 0.31, 0, 1);
  }

  #asc-hdr .asc-nav-link:hover,
  #asc-hdr .asc-nav-link.is-active {
    color: #0d5c3f !important;
  }

  #asc-hdr .asc-nav-link:hover::after,
  #asc-hdr .asc-nav-link.is-active::after {
    transform: scaleX(1);
  }

  #asc-hdr .asc-hdr-right {
    justify-self: end;
    display: flex;
    align-items: center;
  }

  #asc-hdr .asc-hdr-cb {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
  }

  #asc-hdr .asc-menu-trigger {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 40px;
    padding: 0 14px 0 16px;
    border-radius: 8px;
    border: 1.5px solid rgba(9, 19, 28, 0.22);
    background: #ffffff;
    font-size: 13.5px;
    font-weight: 700;
    color: #09131c;
    cursor: pointer;
    user-select: none;
    line-height: 1;
    transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
  }

  #asc-hdr .asc-menu-trigger:hover {
    background: #09131c;
    border-color: #09131c;
    color: #ffffff;
  }

  #asc-hdr .asc-dots-icon {
    display: inline-flex;
    align-items: center;
    gap: 3.5px;
  }

  #asc-hdr .asc-dots-icon i {
    display: block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: currentColor;
  }

  #asc-hdr .asc-menu-label-close,
  #asc-hdr .asc-close-x {
    display: none;
  }

  #asc-hdr .asc-hdr-cb:checked ~ .asc-hdr-bar .asc-menu-trigger {
    background: #09131c;
    border-color: #09131c;
    color: #ffffff;
  }

  #asc-hdr .asc-hdr-cb:checked ~ .asc-hdr-bar .asc-menu-label-open,
  #asc-hdr .asc-hdr-cb:checked ~ .asc-hdr-bar .asc-dots-icon {
    display: none;
  }

  #asc-hdr .asc-hdr-cb:checked ~ .asc-hdr-bar .asc-menu-label-close,
  #asc-hdr .asc-hdr-cb:checked ~ .asc-hdr-bar .asc-close-x {
    display: inline-block;
    font-size: 14px;
  }

  #asc-hdr .asc-drawer {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    background: #09131c;
    color: #ffffff;
    border-top: 0 solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 24px 48px -12px rgba(9, 19, 28, 0.36);
    transition: grid-template-rows 0.3s ease, opacity 0.22s ease;
  }

  #asc-hdr .asc-hdr-cb:checked ~ .asc-drawer {
    grid-template-rows: 1fr;
    opacity: 1;
    border-top-width: 1px;
  }

  #asc-hdr .asc-drawer-clip {
    overflow: hidden;
    max-height: calc(100svh - 76px);
  }

  #asc-hdr .asc-hdr-cb:checked ~ .asc-drawer .asc-drawer-clip {
    overflow-y: auto;
  }

  #asc-hdr .asc-drawer-inner {
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px clamp(20px, 4vw, 56px) 28px;
  }

  #asc-hdr .asc-drawer-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 40px;
  }

  #asc-hdr .asc-drawer-link {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 15px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.14) !important;
    font-family: 'Geist', 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(19px, 2.2vw, 28px);
    font-weight: 700;
    letter-spacing: -0.025em;
    color: #ffffff !important;
    transition: padding-left 0.2s ease, color 0.18s ease;
  }

  #asc-hdr .asc-drawer-link:hover,
  #asc-hdr .asc-drawer-link.is-active {
    padding-left: 12px;
    color: #10b981 !important;
  }

  #asc-hdr .asc-drawer-num {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #10b981;
  }

  #asc-hdr .asc-drawer-foot {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.10);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 13.5px;
    color: rgba(246, 245, 240, 0.72);
  }

  #asc-hdr .asc-drawer-close-link {
    display: inline-flex;
    align-items: center;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    color: #ffffff;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }

  @media (max-width: 1024px) {
    #asc-hdr .asc-nav {
      display: none;
    }

    #asc-hdr .asc-hdr-bar {
      grid-template-columns: 1fr auto;
    }
  }

  @media (max-width: 720px) {
    :root {
      --asc-hh: 64px;
    }

    .asc-hdr-spacer {
      height: 64px !important;
    }

    #asc-hdr .asc-hdr-bar {
      height: 64px;
      padding: 0 16px;
    }

    #asc-hdr .asc-brand-sep,
    #asc-hdr .asc-brand-sub {
      display: none;
    }

    #asc-hdr .asc-drawer-clip {
      max-height: calc(100svh - 64px);
    }

    #asc-hdr .asc-drawer-grid {
      grid-template-columns: 1fr;
    }

    #asc-hdr .asc-drawer-link {
      font-size: 18px;
      padding: 13px 2px;
    }
  }
</style>

<div class="asc-hdr-spacer" id="ascHdrSpacer" aria-hidden="true"></div>

<header id="asc-hdr" aria-label="Navigasi Utama UKM ASC">
  <input type="checkbox" id="ascMenuCb" class="asc-hdr-cb" aria-label="Buka menu navigasi" />

  <div class="asc-hdr-bar">
    <a href="#top" class="asc-brand">
      <div class="asc-brand-logo">ASC<span>.</span></div>
      <div class="asc-brand-sep" aria-hidden="true"></div>
      <div class="asc-brand-sub">Al-Qur'an<br />Study Club UM</div>
    </a>

    <nav class="asc-nav" aria-label="Navigasi Utama">
      <a href="#asc-visi-misi" class="asc-nav-link">Visi Misi</a>
      <a href="#asc-pembinaan" class="asc-nav-link">Pembinaan</a>
      <a href="#asc-struktur" class="asc-nav-link">Struktur</a>
      <a href="#prestasi" class="asc-nav-link">Prestasi</a>
      <a href="#kabinet" class="asc-nav-link">Kabinet</a>
    </nav>

    <div class="asc-hdr-right">
      <label for="ascMenuCb" class="asc-menu-trigger" tabindex="0" aria-label="Buka atau tutup menu navigasi">
        <span class="asc-menu-label-open">Menu</span>
        <span class="asc-dots-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="asc-menu-label-close">Tutup</span>
        <span class="asc-close-x" aria-hidden="true">✕</span>
      </label>
    </div>
  </div>

  <div class="asc-drawer" aria-label="Daftar Menu Navigasi">
    <div class="asc-drawer-clip">
      <div class="asc-drawer-inner">
        <div class="asc-drawer-grid">
          <a href="#asc-visi-misi" class="asc-drawer-link"><span class="asc-drawer-num">01</span><span>Visi &amp; Misi</span></a>
          <a href="#asc-pembinaan" class="asc-drawer-link"><span class="asc-drawer-num">02</span><span>10 Bidang Pembinaan</span></a>
          <a href="#asc-struktur" class="asc-drawer-link"><span class="asc-drawer-num">03</span><span>Struktur Organisasi</span></a>
          <a href="#prestasi" class="asc-drawer-link"><span class="asc-drawer-num">04</span><span>Jejak Prestasi (42)</span></a>
          <a href="#kabinet" class="asc-drawer-link"><span class="asc-drawer-num">05</span><span>Departemen &amp; Kabinet</span></a>
          <a href="#gabung" class="asc-drawer-link"><span class="asc-drawer-num">06</span><span>Daftar &amp; Kontak</span></a>
        </div>

        <div class="asc-drawer-foot">
          <span>Kompleks Masjid Al-Hikmah · Universitas Negeri Malang · @ukm_asc_um</span>
          <label for="ascMenuCb" class="asc-drawer-close-link">Tutup Menu ✕</label>
        </div>
      </div>
    </div>
  </div>

  <div class="asc-scroll-line" id="ascScrollLine" aria-hidden="true"></div>
</header>

<script>
  (function () {
    'use strict';

    var hdr = document.getElementById('asc-hdr');
    if (!hdr) return;

    var cb = document.getElementById('ascMenuCb');
    var trigger = hdr.querySelector('.asc-menu-trigger');
    var line = document.getElementById('ascScrollLine');

    function unlockAncestors() {
      try {
        var p = hdr.parentElement, n = 0;
        while (p && p !== document.documentElement && n++ < 25) {
          var cs = window.getComputedStyle(p);
          if (/hidden|auto|scroll/.test(cs.overflow + cs.overflowX + cs.overflowY)) {
            p.style.setProperty('overflow', 'visible', 'important');
          }
          if (cs.transform && cs.transform !== 'none') {
            p.style.setProperty('transform', 'none', 'important');
          }
          if (p.classList && (p.classList.contains('et_pb_section') || p.classList.contains('et_pb_row') ||
              p.classList.contains('et_pb_column') || p.classList.contains('et_pb_module') ||
              p.classList.contains('elementor-section'))) {
            p.style.setProperty('z-index', '9000', 'important');
          }
          p = p.parentElement;
        }
      } catch (_) {}
    }

    var TARGETS = [
      { href: '#asc-visi-misi', sel: ['#asc-vm', '#asc-visi-misi'], sticky: true },
      { href: '#asc-pembinaan', sel: ['#asc-pb', '#asc-pembinaan'], sticky: true },
      { href: '#asc-struktur', sel: ['#asc-struktur'], sticky: true },
      { href: '#prestasi', sel: ['#prestasi', '#asc-prestasi', '#galeri'], sticky: false },
      { href: '#kabinet', sel: ['#kabinet'], sticky: false },
      { href: '#gabung', sel: ['#gabung', '#faq', '#asc-kontak'], sticky: false }
    ];

    function findEl(sel) {
      for (var i = 0; i < sel.length; i++) {
        var el = document.querySelector(sel[i]);
        if (el) return el;
      }
      return null;
    }

    var navLinks = [].slice.call(hdr.querySelectorAll('.asc-nav-link, .asc-drawer-link'));
    var lastHh = -1, lastWpTop = -1, ticking = false;

    function updateOnScroll() {
      ticking = false;
      var y = Math.max(0, window.pageYOffset || document.documentElement.scrollTop || 0);
      hdr.classList.toggle('is-scrolled', y > 16);

      var wpBar = document.getElementById('wpadminbar');
      var wpTop = wpBar ? Math.max(0, Math.round(wpBar.getBoundingClientRect().bottom)) : 0;
      if (wpTop !== lastWpTop) {
        lastWpTop = wpTop;
        hdr.style.setProperty('top', wpTop + 'px', 'important');
      }

      var barEl = hdr.querySelector('.asc-hdr-bar') || hdr;
      var hh = Math.max(0, Math.round(barEl.getBoundingClientRect().bottom));
      if (Math.abs(hh - lastHh) > 1) {
        lastHh = hh;
        document.documentElement.style.setProperty('--asc-hh', hh + 'px');
      }

      if (line) {
        var max = document.documentElement.scrollHeight - window.innerHeight;
        line.style.width = max > 0 ? Math.min(100, Math.max(0, (y / max) * 100)).toFixed(2) + '%' : '0%';
      }

      var activeHref = null, bestTop = -1e9;
      for (var i = 0; i < TARGETS.length; i++) {
        var el = findEl(TARGETS[i].sel);
        if (!el) continue;
        var top = el.getBoundingClientRect().top;
        if (top <= hh + 140 && top > bestTop) {
          bestTop = top;
          activeHref = TARGETS[i].href;
        }
      }
      for (var j = 0; j < navLinks.length; j++) {
        navLinks[j].classList.toggle('is-active', navLinks[j].getAttribute('href') === activeHref);
      }
    }

    function schedule() {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(updateOnScroll);
      }
    }

    if (trigger && cb) {
      trigger.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          cb.checked = !cb.checked;
        }
      });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && cb && cb.checked) cb.checked = false;
    });

    document.addEventListener('click', function (e) {
      if (cb && cb.checked && !hdr.contains(e.target)) cb.checked = false;
    });

    hdr.addEventListener('click', function (e) {
      var link = e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!link) return;
      if (cb) cb.checked = false;

      var href = link.getAttribute('href');
      if (!href) return;
      if (href === '#top') {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      var cfg = null;
      for (var i = 0; i < TARGETS.length; i++) {
        if (TARGETS[i].href === href) { cfg = TARGETS[i]; break; }
      }
      var el = cfg ? findEl(cfg.sel) : document.querySelector(href);
      if (el) {
        e.preventDefault();
        var barEl = hdr.querySelector('.asc-hdr-bar') || hdr;
        var offset = (cfg && cfg.sticky) ? 0 : Math.round(barEl.getBoundingClientRect().bottom) + 8;
        var targetTop = el.getBoundingClientRect().top + (window.pageYOffset || 0) - offset;
        window.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });
      }
    });

    unlockAncestors();
    updateOnScroll();
    window.addEventListener('scroll', schedule, { passive: true });
    window.addEventListener('resize', function () { unlockAncestors(); schedule(); }, { passive: true });
    window.addEventListener('load', function () { unlockAncestors(); updateOnScroll(); });
    [150, 500, 1200, 2200].forEach(function (ms) {
      setTimeout(function () { unlockAncestors(); updateOnScroll(); }, ms);
    });
  })();
</script>
