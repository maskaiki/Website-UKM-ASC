    if (!d.getElementById('asc-fonts')) {
      var l = d.createElement('link'); l.id = 'asc-fonts'; l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=Geist:wght@500..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap';
      d.head.appendChild(l);

    /* 2. Buka overflow milik container Divi/Elementor/tema WordPress yang memblokir position: sticky */
    A.unlock = function (root) {
      try {
        var n = root;
        while (n && n !== d) {
          if (n.nodeType === 1) {
            var cs = w.getComputedStyle(n);
            if (/hidden|auto|scroll|clip/.test(cs.overflow + cs.overflowX + cs.overflowY)) {
              n.style.setProperty('overflow', 'visible', 'important');
              n.style.setProperty('overflow-x', 'visible', 'important');
              n.style.setProperty('overflow-y', 'visible', 'important');

      } catch (e) { /* abaikan */ }
    };
  })(window, document);
</script>

    /* ======================================================================================================== */

    var root = document.getElementById('asc-pb');
    if (!root) return;
    var track = document.getElementById('pbTrack');
    var countEl = document.getElementById('pbCount');
    var wash = root.querySelector('.pb-wash');
    var line = root.querySelector('.pb-uline path');
    var stage = root.querySelector('.pb-stage');

    var ORN_SVG = '<svg class="pb-ph-orn" viewBox="0 0 100 100" fill="none" aria-hidden="true">' +
      '<rect x="22" y="22" width="56" height="56" stroke="#e5c166" stroke-width="1.4"/>' +
      '<rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)" stroke="#e5c166" stroke-width="1.4"/>' +
      '<circle cx="50" cy="50" r="14" stroke="#e5c166" stroke-width="1.2"/></svg>';

    var h = '';
    DATA.forEach(function (x, i) {
      var n = ('0' + (i + 1)).slice(-2);
      var topPanel = '<div class="pb-img pb-ph" role="img" aria-label="' + x.t + '">' + ORN_SVG +
        '<div class="pb-ph-top">' +
        '<span class="pb-ph-num">' + n + '</span>' +
        '<div class="pb-badges">' +
        '<span class="pb-badge">' + x.cat + '</span>' +
        '<a class="pb-ig-pill" href="' + x.igUrl + '" target="_blank" rel="noopener noreferrer" title="Buka Instagram ' + x.ig + '">' + x.ig + ' ↗</a>' +
        '</div>' +
        '</div>' +
        '<div class="pb-ph-meta">' +
        '<span class="pb-ph-focus">' + x.focus + '</span>' +
        '</div>' +
        '</div>';

      var schedHtml = '<div class="pb-sched-box">' +
        '<div class="pb-sched-item"><span class="pb-icon">🗓</span><span><strong>Jadwal:</strong> ' + x.schedule + '</span></div>' +
        '<div class="pb-sched-item"><span class="pb-icon">📍</span><span><strong>Tempat:</strong> ' + x.loc + '</span></div>' +
        '</div>';

      var bulletsHtml = '<ul class="pb-pts">' +
        x.bullets.map(function (b) { return '<li>' + b + '</li>'; }).join('') +
        '</ul>';

      h += '<article class="pb-card">' +
        '<div>' +
        topPanel +
        '<h3>' + x.t + '</h3>' +
        schedHtml +
        bulletsHtml +
        '</div>' +
        '<div class="pb-row">' +
        '<a class="pb-btn" href="' + x.link + '" target="_blank" rel="noopener noreferrer"><span>Daftar Google Form</span><span aria-hidden="true">→</span></a>' +
        '</div>' +
        '</article>';
    });
    if (track) track.innerHTML = h;

    var cards = track ? [].slice.call(track.children) : [];
    var lefts = [], vw = 1200, vh = 800, trackW = 0, startX = 0, endX = 0, ticking = false;

    function lerp(a, b, t) { return a + (b - a) * t; }

    function update() {
      ticking = false;
      if (!root) return;
      var r = root.getBoundingClientRect(), total = root.offsetHeight - vh;
      if (total <= 0) total = 1;
      var p = Math.min(1, Math.max(0, -r.top / total));
      root.style.setProperty('--p', p);
      var x = lerp(startX, endX, p);
      if (track) track.style.transform = 'translate3d(' + x.toFixed(2) + 'px,0,0)';
      if (wash) wash.style.opacity = Math.min(1, Math.sin(Math.PI * Math.min(1, p * 1.08)) * 1.25);
      var c = Math.min(1, p * 6);
      if (line) line.style.stroke = 'rgb(' + Math.round(lerp(215, 13, c)) + ',' + Math.round(lerp(230, 92, c)) + ',' + Math.round(lerp(220, 63, c)) + ')';
      var best = 0, bd = 1e9;
      cards.forEach(function (el, i) {
        var cx = x + (lefts[i] || 0), off = (cx - vw / 2) / vw;
        var rot = (i % 2 ? 1 : -1) * 2.2 + off * 4, y = Math.sin(i * 1.7) * 12 + Math.abs(off) * 14;
        el.style.transform = 'translate3d(0,' + y.toFixed(2) + 'px,0) rotate(' + rot.toFixed(2) + 'deg)';
        var d = Math.abs(off); if (d < bd) { bd = d; best = i; }
      });
      if (countEl) countEl.textContent = (best + 1) + ' dari ' + cards.length;
    }

    function onScroll() {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(update);
      }
    }

    function measure() {
      if (!root || !track) return;
      vw = Math.min(window.innerWidth, document.documentElement.clientWidth || window.innerWidth);
      vh = window.innerHeight;
      trackW = track.scrollWidth || 3600;
      cards = [].slice.call(track.children);
      lefts = cards.map(function (c) { return c.offsetLeft + c.offsetWidth / 2; });
      startX = (vw / 2) - lefts[0];
      endX = (vw / 2) - lefts[cards.length - 1];
      root.style.setProperty('height', Math.round(vh + (startX - endX) * 0.85) + 'px', 'important');
      update();
    }

    /* Buka overflow milik container WordPress/Divi/Elementor agar position: sticky selalu hidup */
    function fixParents(el) {
      if (!el) return;
      if (root) root.style.setProperty('overflow', 'visible', 'important');
      var p = el.parentElement, n = 0;
      while (p && p !== document.documentElement && n++ < 25) {
        var cs = window.getComputedStyle(p);
        if (/hidden|auto|scroll|clip/.test(cs.overflow + cs.overflowX + cs.overflowY)) {
          p.style.setProperty('overflow', 'visible', 'important');
          p.style.setProperty('overflow-x', 'visible', 'important');
          p.style.setProperty('overflow-y', 'visible', 'important');
        }
        p = p.parentElement;
      }
      if (document.documentElement && document.documentElement.style) {
        document.documentElement.style.setProperty('overflow-x', 'visible', 'important');
      }
      if (document.body && document.body.style) {
        document.body.style.setProperty('overflow-x', 'visible', 'important');
      }
    }

    function init() {
      if (!root) root = document.getElementById('asc-pb');
      if (!root) return false;
      if (root.dataset.ready === '1') return true;
      root.dataset.ready = '1';
      if (!track) track = document.getElementById('pbTrack');
      if (!countEl) countEl = document.getElementById('pbCount');
      if (!wash && root) wash = root.querySelector('.pb-wash');
      if (!line && root) line = root.querySelector('.pb-uline path');
      if (!stage && root) stage = root.querySelector('.pb-stage');

      fixParents(root);
      measure();
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', function () {
        fixParents(root);
        measure();
      }, { passive: true });
      window.addEventListener('orientationchange', function () {
        setTimeout(function () { fixParents(root); measure(); }, 200);
      });
      window.addEventListener('load', function () {
        fixParents(root);
        measure();
      });
      window.addEventListener('pageshow', function () {
        fixParents(root);
        measure();
      });
      if (window.ResizeObserver && stage) {
        new ResizeObserver(function () {
          fixParents(root);
          measure();
        }).observe(stage);
      }
      // Auto-calibration: jalankan berkala otomatis saat load agar desktop tidak perlu zoom in/out
      [50, 150, 300, 600, 1200, 2000].forEach(function (ms) {
        setTimeout(function () {
          fixParents(root);
          measure();
          try { window.dispatchEvent(new Event('resize')); } catch (e) { }
        }, ms);
      });
      return true;
    }

    function run() {
      if (init()) return;
      var n = 0, t = setInterval(function () {
        if (init() || ++n >= 25) clearInterval(t);
      }, 150);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', run);
    } else {
      run();
    }
  })();
</script>
