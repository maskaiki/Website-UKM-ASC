<script>
  (function () {
    const track = document.getElementById('asc-soc-track');
    const titleBox = document.getElementById('asc-soc-title-box');
    const subTitle = document.getElementById('asc-soc-sub');
    const cardsWrap = document.getElementById('asc-soc-cards');
    const hint = document.getElementById('asc-soc-hint');
    const cards = cardsWrap ? cardsWrap.querySelectorAll('.asc-pill-card') : [];

    const cardConfigs = [
      { startP: 0.08, endP: 0.68, startY: 110, startScale: 0.88, startRot: -3 },
      { startP: 0.16, endP: 0.74, startY: 122, startScale: 0.86, startRot: -1 },
      { startP: 0.12, endP: 0.70, startY: 114, startScale: 0.88, startRot: 1 },
      { startP: 0.20, endP: 0.78, startY: 126, startScale: 0.86, startRot: 3 }
    ];

    function updatePlariumScroll() {
      if (!track) return;
      const rect = track.getBoundingClientRect();
      const trackH = track.offsetHeight;
      const winH = window.innerHeight;
      const totalDist = trackH - winH;

      if (totalDist <= 0) return;

      let progress = -rect.top / totalDist;
      progress = Math.max(0, Math.min(1, progress));

      if (hint) {
        hint.style.opacity = Math.max(0, 1 - progress * 4.5);
      }

      if (titleBox) {
        const titleY = -progress * (winH * 0.30);
        const titleScale = 1 - progress * 0.28;
        titleBox.style.transform = `translate(-50%, calc(-50% + ${titleY}px)) scale(${titleScale})`;

        if (subTitle) {
          subTitle.style.opacity = Math.max(0, 1 - progress * 2.2);
        }
      }

      cards.forEach((card, i) => {
        const cfg = cardConfigs[i] || { startP: 0.1, endP: 0.72, startY: 115, startScale: 0.88, startRot: 0 };
        let localP = (progress - cfg.startP) / (cfg.endP - cfg.startP);
        localP = Math.max(0, Math.min(1, localP));

        const eased = 1 - Math.pow(1 - localP, 4);
        const currentY = (1 - eased) * cfg.startY;
        const currentScale = cfg.startScale + (1 - cfg.startScale) * eased;
        const currentRot = (1 - eased) * cfg.startRot;
        const currentOpacity = Math.min(1, Math.pow(eased, 1.3));

        card.style.transform = `translate3d(0, ${currentY}vh, 0) scale(${currentScale}) rotate(${currentRot}deg)`;
        card.style.opacity = currentOpacity.toFixed(3);
      });
    }

    function fixParents(el) {
      if (!el) return;
      var p = el.parentElement, n = 0;
      while (p && p !== document.documentElement && n++ < 25) {
        var cs = window.getComputedStyle(p);
        if (/hidden|auto|scroll/.test(cs.overflow + cs.overflowX + cs.overflowY)) {
          p.style.setProperty('overflow', 'visible', 'important');
        }
        p = p.parentElement;
      }
      if (document.documentElement) {
        document.documentElement.style.setProperty('overflow-x', 'visible', 'important');
      }
      if (document.body) {
        document.body.style.setProperty('overflow-x', 'visible', 'important');
      }
    }

    const asckRoot = document.getElementById('asc-kontak') || document.body;
    let ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { ticking = false; updatePlariumScroll(); });
    }

    function init() {
      if (!track) return false;
      if (track.dataset.ready) return true;
      track.dataset.ready = '1';
      fixParents(asckRoot);
      updatePlariumScroll();
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', function () {
        fixParents(asckRoot);
        onScroll();
      }, { passive: true });
      window.addEventListener('load', function () {
        fixParents(asckRoot);
        onScroll();
      });
      if (window.ResizeObserver) {
        new ResizeObserver(function () {
          fixParents(asckRoot);
          onScroll();
        }).observe(track);
      }
      [50, 150, 300, 600, 1200, 2000].forEach(function (ms) {
        setTimeout(function () {
          fixParents(asckRoot);
          onScroll();
          try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        }, ms);
      });
      return true;
    }

    function run() {
      if (init()) return;
      var n = 0, t = setInterval(function () {
        if (init() || ++n >= 25) clearInterval(t);
      }, 150);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', run);
    } else {
      run();
    }

    cards.forEach(card => {
      card.addEventListener('mousemove', e => {
        if (parseFloat(card.style.opacity || '0') < 0.85) return;

        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        const rotX = -(y / rect.height) * 8;
        const rotY = (x / rect.width) * 8;

        card.style.transform = `translate3d(0, 0, 0) perspective(600px) rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg) scale(1.03)`;
      });

      card.addEventListener('mouseleave', () => {
        updatePlariumScroll();
      });
    });
  })();
</script>
