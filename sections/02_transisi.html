<!-- =====================================================================
  UKM ASC UNIVERSITAS NEGERI MALANG - SECTION 02: TRANSISI PANGGUNG FOTO (ASYAM)
  Fungsi: Scroll-driven parallax panggung foto Masjid Al-Hikmah UM
  
  Cara Pakai di WordPress (Elementor / Divi):
  1. Widget "Custom HTML" pada container Section 2 (Full Width).
  2. Pastikan overflow container = Default / Visible agar sticky berjalan.
====================================================================== -->

<style>
  #transisi {
    position: relative;
    height: 250vh;
    width: 100%;
    background: #ffffff;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  #transisi * {
    box-sizing: border-box;
  }

  #transisi .trans-sticky-stage {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #f7f7f5;
  }

  #transisi .trans-photo-box {
    position: absolute;
    inset: 40px;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(9, 19, 28, 0.14);
    border: 1.5px solid rgba(9, 19, 28, 0.08);
    background: #09131c;
  }

  #transisi .trans-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transform: scale(1.08);
    transition: transform 0.1s ease-out;
    filter: brightness(0.88);
  }

  #transisi .trans-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(9, 19, 28, 0.3) 0%, rgba(9, 19, 28, 0.75) 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: clamp(24px, 5vw, 64px);
    color: #ffffff;
  }

  #transisi .trans-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #10b981;
    margin-bottom: 8px;
  }

  #transisi .trans-h2 {
    font-size: clamp(28px, 4.5vw, 54px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    color: #ffffff;
    margin-bottom: 12px;
    max-width: 820px;
  }

  #transisi .trans-h2 span {
    color: #facc15;
  }

  #transisi .trans-desc {
    font-size: clamp(14px, 1.4vw, 17px);
    color: rgba(255, 255, 255, 0.85);
    max-width: 680px;
    line-height: 1.6;
    margin: 0;
  }

  @media (max-width: 768px) {
    #transisi .trans-photo-box {
      inset: 16px;
      border-radius: 20px;
    }
    #transisi {
      height: 180vh;
    }
  }
</style>

<section id="transisi">
  <div class="trans-sticky-stage" id="transStage">
    <div class="trans-photo-box" id="transBox">
      <!-- Foto Arsitektur Masjid Al-Hikmah UM -->
      <img class="trans-img" id="transImg"
           src="https://images.unsplash.com/photo-1542816417-0983c9c9ad53?auto=format&fit=crop&w=1600&q=80"
           alt="Kompleks Masjid Al-Hikmah Universitas Negeri Malang" />
      
      <div class="trans-overlay">
        <div class="trans-kicker">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;"></span>
          02 · Pusat Peradaban &amp; Candradimuka
        </div>
        <h2 class="trans-h2">
          Kompleks Masjid <span>Al-Hikmah</span> Universitas Negeri Malang.
        </h2>
        <p class="trans-desc">
          Tempat lahir dan berseminya ribuan kader pecinta Al-Qur'an UM sejak 2013. Dari lantunan tilawah harian di serambi masjid hingga panggung Juara Umum MTQ Mahasiswa Nasional.
        </p>
      </div>
    </div>
  </div>
</section>

<script>
  (function() {
    const section = document.getElementById('transisi');
    const img = document.getElementById('transImg');
    const box = document.getElementById('transBox');

    if (section && img) {
      function onScroll() {
        const rect = section.getBoundingClientRect();
        const winH = window.innerHeight;
        const total = section.offsetHeight - winH;
        if (total <= 0) return;

        let progress = -rect.top / total;
        progress = Math.max(0, Math.min(1, progress));

        // Parallax zoom halus 1.0 -> 1.18
        const scale = 1.0 + progress * 0.16;
        img.style.transform = `scale(${scale.toFixed(4)})`;

        // Transisi border radius saat scroll
        if (box) {
          const r = 28 - progress * 14;
          box.style.borderRadius = `${Math.max(12, r)}px`;
        }
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    }
  })();
</script>
