<!-- =====================================================================
  UKM ASC UNIVERSITAS NEGERI MALANG - SECTION 03: STRUKTUR ORGANISASI (SCROLL STORY)
  Cara pakai di WordPress (Elementor / Divi):
  1. Widget "Custom HTML" di container FULL WIDTH, paste seluruh file ini.
  2. Elementor: Container > Advanced > Overflow = Default (agar efek "menempel" jalan).
  3. Ganti isi: cari "DATA STRUKTUR" di bagian script (nama bidang, program, deskripsi).
====================================================================== -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  #asc-struktur{ position:relative; width:100%; height:720vh; background:#0f172a; color:#fff; --ice:#e0f2fe; --sky:#38bdf8;
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; }
  #asc-struktur *{ box-sizing:border-box; margin:0; padding:0; }
  #asc-struktur .st-pin{ position:sticky; top:0; height:100vh; height:100svh; overflow:clip; display:flex; flex-direction:column; padding:3.5vh 4vw 3vh;
    background:radial-gradient(ellipse at 12% 0%,rgba(2,132,199,.3),transparent 55%); }

  /* Kepala + penunjuk alur */
  #asc-struktur .st-top{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex:none; }
  #asc-struktur .st-tag{ display:inline-block; padding:5px 13px; border:1px solid rgba(186,230,253,.35); border-radius:999px; background:rgba(2,132,199,.14);
    font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#bae6fd; margin-bottom:8px; }
  #asc-struktur h2{ font-size:clamp(24px,3vw,46px); font-weight:600; letter-spacing:-.035em; line-height:1; color:var(--ice); }
  #asc-struktur .st-steps{ position:relative; display:grid; grid-template-columns:repeat(6,1fr); width:min(680px,52vw); padding-bottom:14px; }
  #asc-struktur .st-steps::before{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:rgba(186,230,253,.16); }
  #asc-struktur .st-fill{ position:absolute; left:0; bottom:0; height:2px; width:8%; background:linear-gradient(90deg,#0284c7,#38bdf8); }
  #asc-struktur .st-s{ all:unset; cursor:pointer; position:relative; text-align:center; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#64748b; padding:0 2px 12px; transition:color .3s; }
  #asc-struktur .st-s::after{ content:""; position:absolute; left:50%; bottom:-4px; width:9px; height:9px; margin-left:-4.5px; border-radius:50%; background:#0f172a; border:2px solid #475569; transition:.3s; }
  #asc-struktur .st-s.on{ color:var(--ice); } #asc-struktur .st-s.on::after,#asc-struktur .st-s.done::after{ background:var(--sky); border-color:var(--sky); }
  #asc-struktur .st-s:focus-visible{ outline:2px solid var(--sky); outline-offset:2px; }

  #asc-struktur .st-main{ position:relative; flex:1; min-height:0; margin-top:3vh; }

  /* Bagan */
  #asc-struktur .st-cl{ position:absolute; inset:0; will-change:transform,opacity; }
  #asc-struktur .st-chart{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); width:min(100%,1400px,calc((100svh - 26vh)*1000/385)); aspect-ratio:1000/385; container-type:inline-size; }
  #asc-struktur .st-n{ position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; line-height:1.15;
    font-size:clamp(11px,1.45cqw,17px); font-weight:700; border-radius:9px; padding:0 6px; will-change:transform,opacity; }
  #asc-struktur .st-n small{ font-size:.78em; font-weight:500; opacity:.85; margin-top:2px; }
  #asc-struktur .n-pb{ background:var(--sky); color:#0f172a; } #asc-struktur .n-core{ background:#0284c7; }
  #asc-struktur .n-mk{ border:1.5px dashed #bae6fd; color:#bae6fd; background:rgba(186,230,253,.06); }
  #asc-struktur .n-dept{ background:#0369a1; border:1.5px solid var(--sky); } #asc-struktur .n-lso{ background:#475569; border:1.5px solid #94a3b8; }
  #asc-struktur .st-ln{ position:absolute; background:var(--sky); opacity:.85; will-change:transform; }
  #asc-struktur .st-ln.dd{ background:repeating-linear-gradient(90deg,#bae6fd 0 6px,transparent 6px 11px); }
  #asc-struktur .st-leg{ position:absolute; left:0; right:0; bottom:0; display:flex; flex-wrap:wrap; gap:6px 22px; justify-content:center; font-size:11.5px; color:#94a3b8; }
  #asc-struktur .st-leg i{ display:inline-block; width:22px; height:0; border-top:2px solid var(--sky); vertical-align:middle; margin-right:7px; }
  #asc-struktur .st-leg i.d{ border-top-style:dashed; border-color:#bae6fd; }

  /* Rincian departemen */
  #asc-struktur .st-sc{ position:absolute; inset:0; display:grid; grid-template-columns:5fr 7fr; gap:4vw; align-content:center; align-items:center; opacity:0; visibility:hidden; }
  #asc-struktur .st-ix{ display:inline-block; font-size:12px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--sky); margin-bottom:10px; }
  #asc-struktur .st-nm{ font-size:clamp(40px,7.4vw,124px); font-weight:500; letter-spacing:-.05em; line-height:.95; color:var(--ice); }
  #asc-struktur .st-ds{ margin-top:2.4vh; max-width:430px; font-size:clamp(13px,1.05vw,16px); line-height:1.7; color:#cbd5e1; }
  #asc-struktur .st-lb{ display:block; font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--sky); margin:0 0 10px; }
  #asc-struktur .st-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:3vh; }
  #asc-struktur .st-chip{ padding:10px 14px; border-radius:10px; background:rgba(224,242,254,.07); border:1px solid rgba(186,230,253,.18); font-size:clamp(12.5px,1vw,15px); font-weight:700; line-height:1.3; }
  #asc-struktur .st-chip small{ display:block; margin-top:2px; font-size:.82em; font-weight:500; color:#94a3b8; }
  #asc-struktur .st-pills{ display:flex; flex-wrap:wrap; gap:8px; }
  #asc-struktur .st-pill{ padding:7px 13px; border-radius:999px; background:#0284c7; font-size:clamp(11.5px,.92vw,14px); font-weight:600; }

  @media (max-width:700px){
    #asc-struktur{ height:760vh; }
    #asc-struktur .st-pin{ padding:3vh 5vw 2vh; }
    #asc-struktur .st-top{ flex-direction:column; align-items:stretch; gap:14px; }
    #asc-struktur .st-steps{ width:100%; } #asc-struktur .st-s{ font-size:0; padding-bottom:8px; } #asc-struktur .st-s.on{ font-size:10px; }
    #asc-struktur .st-chart{ width:100%; top:0; transform:translateX(-50%); aspect-ratio:360/372; } #asc-struktur .st-n{ font-size:clamp(9.5px,2.9cqw,12px); padding:0 3px; }
    #asc-struktur .st-leg{ font-size:10.5px; }
    #asc-struktur .st-sc{ grid-template-columns:1fr; gap:2.2vh; align-content:start; }
    #asc-struktur .st-nm{ font-size:clamp(36px,13vw,60px); } #asc-struktur .st-ds{ font-size:12.5px; margin-top:1.2vh; line-height:1.55; }
    #asc-struktur .st-grid{ gap:6px; margin-bottom:1.8vh; } #asc-struktur .st-chip{ padding:7px 10px; font-size:12px; }
    #asc-struktur .st-pills{ gap:6px; } #asc-struktur .st-pill{ padding:5px 10px; font-size:11px; }
  }

  /* Gerak dikurangi: tampil statis */
  #asc-struktur.st-static{ height:auto; } #asc-struktur.st-static .st-pin{ position:relative; height:auto; overflow:visible; padding:48px 4vw; }
  #asc-struktur.st-static .st-steps{ display:none; } #asc-struktur.st-static .st-main{ margin-top:24px; }
  #asc-struktur.st-static .st-cl,#asc-struktur.st-static .st-sc{ position:relative; inset:auto; opacity:1; visibility:visible; margin-bottom:56px; }
  #asc-struktur.st-static .st-cl{ height:auto; padding-bottom:40px; } #asc-struktur.st-static .st-chart{ position:relative; left:auto; top:auto; transform:none; margin:0 auto; }
  #asc-struktur.st-static .st-leg{ position:relative; margin-top:16px; }
</style>

<section id="asc-struktur" aria-label="Struktur Organisasi UKM ASC">
  <div class="st-pin">
    <div class="st-top">
      <div><span class="st-tag">Kabinet Al-Fatih &middot; UKM ASC UM</span><h2>Struktur Organisasi</h2></div>
      <nav class="st-steps" id="stSteps" aria-label="Alur struktur"><i class="st-fill" id="stFill"></i></nav>
    </div>
    <div class="st-main">
      <div class="st-cl" id="stCl">
        <div class="st-chart" id="stChart"></div>
        <div class="st-leg"><span><i></i>Garis instruktif</span><span><i class="d"></i>Garis koordinatif</span><span>Gulir untuk menelusuri tiap departemen &darr;</span></div>
      </div>
      <div id="stScenes"></div>
    </div>
  </div>
</section>

<script>
(function(){
  /* ============ DATA STRUKTUR (bidang = kotak, e = program & event) ============ */
  var D = [
    {k:'Kaderisasi', ds:'Menyiapkan dan mengembangkan kader serta pengurus ASC lewat pelatihan dan kegiatan kaderisasi.',
     b:[['HRD','Human Resource Development'],['EO','Event Organizer']],
     e:['Ta’aruf Qur’ani (TAQUR)','LPQMO-TM UKM ASC','LKMO ASC','Tanmiyah Kafa’ah Khudama’ (TKK)']},
    {k:'Pembinaan', ds:'Pusat pembinaan Al-Qur’an: dari bacaan, hafalan, dan seni, hingga karya ilmiah serta inovasi digital.',
     b:[['Tahsinil Qiro’ah'],['Tartilil Qur’an'],['Tilawatil Qur’an'],['Tahfidhil Qur’an'],['Khaththil Qur’an'],['Syarhil Qur’an'],['Fahmil Qur’an'],['Karya Tulis Ilmiah Al-Qur’an','KTIA'],['Desain Aplikasi Al-Qur’an','DAQ']],
     e:['Grand Opening','Lailatul Qiro’ah','Semaan Akbar Se-Malang Raya','MTQ-IP']},
    {k:'Kesejahteraan', ds:'Mengurus kebutuhan internal, seni religi, keuangan, dan program layanan seperti BTQ dan ASPP.',
     b:[['Rumah Tangga','RT'],['Ketakmiran dan Seni Religi','KSR'],['Maliyah'],['ASC Kaligrafi','ASCKal'],['After School Program Plus','ASPP'],['Bimbingan Baca Tulis Al-Qur’an','BTQ']],
     e:['Milad UKM ASC','Pondok Kilat','Seminar Kewirausahaan','Pembinaan Banjari Ulul Musthofa','Pembinaan Voice of ASC (VoA)']},
    {k:'Syiar', ds:'Menyebarkan dakwah dan informasi ASC lewat media dan publikasi, serta menjalin silaturahmi internal dan eksternal.',
     b:[['Publikasi'],['Dakwah'],['Humas Internal'],['Humas Eksternal']],
     e:['ASC Info','ASC Stream','YouTube · Instagram Reels · TikTok','Mading ASC','ASC Quotes','Ngobrol Dekat (Ngode) Bareng ASC','ASC Buletin','ASC Komik','SIASAT (Silaturahmi ASC Pusat)','SAMAWA (Sambang ORMAWA)','Milad Card','SILUK Eksternal (Silaturahmi UKM)','SULAM Eksternal (Silaturahmi Lembaga)']},
    {k:'LSO', ix:'Lembaga Semi Otonom', ds:'Lembaga semi otonom yang menjalankan program khusus di bawah naungan departemen-departemen ASC.',
     b:[['LSO PP 2','Naungan: Kaderisasi · Pembinaan · Syiar · Kesejahteraan'],['LSO PP 3','Naungan: Kaderisasi · Pembinaan · Syiar'],['LSO TDI','Tafaqquh fii Diinil Islam · Bidang Kurikulum, Humas, IT, Admin + Kesejahteraan']],
     e:['Yaumul Qir’an Junior (YQJ)','Open House PP2','Pekan Dakwah Milenial (PDM)','Bakti Sosial','Grand Opening TDI','Diklat Mentor','SARTAS TDI']}
  ];
  /* ================================================================================ */

  var root=document.getElementById('asc-struktur'); if(!root) return;
  var chart=document.getElementById('stChart'), cl=document.getElementById('stCl'), steps=document.getElementById('stSteps'), fill=document.getElementById('stFill'), scWrap=document.getElementById('stScenes');
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

  /* --- node bagan: id, label, sub, kelas, waktu muncul (0-1 dari fase bangun) --- */
  var NODES=[['pb','Pembina','','n-pb',0,.08],['kt','Ketua Umum','','n-core',.16,.22],['mk','Majelis Kehormatan','','n-mk',.26,.32],['wk','Wakil Ketua Umum','','n-core',.28,.34],
    ['bn','Bendahara Umum','','n-core',.42,.48],['sk','Sekretaris Umum','','n-core',.42,.48]]
    .concat(D.map(function(d,i){ var sub=i<4?d.b.length+' bidang':'Lembaga Semi Otonom'; return ['d'+i,d.k==='LSO'?'LSO':d.k,sub,i<4?'n-dept':'n-lso',.70+i*.04,.78+i*.04]; }));
  var el={}; NODES.forEach(function(n){ var d=document.createElement('div'); d.className='st-n '+n[3]; d.innerHTML=esc(n[1])+(n[2]?'<small>'+esc(n[2])+'</small>':''); chart.appendChild(d); el[n[0]]=d; });

  /* --- dua tata letak: desktop & HP ([x, y, lebar, tinggi]) --- */
  var LAY={
    d:{W:1000,H:385,bus:250,pb:[500,34,170,40],kt:[500,106,190,40],mk:[830,106,190,40],wk:[500,178,190,40],bn:[220,178,180,40],sk:[780,178,180,40],
       d0:[100,320,170,70],d1:[300,320,170,70],d2:[500,320,170,70],d3:[700,320,170,70],d4:[900,320,170,70]},
    m:{W:360,H:372,bus:196,pb:[180,24,150,36],kt:[180,80,140,36],mk:[305,80,88,36],wk:[180,138,116,36],bn:[62,138,108,36],sk:[298,138,108,36],
       d0:[62,238,108,46],d1:[180,238,108,46],d2:[298,238,108,46],d3:[120,318,108,46],d4:[240,318,108,46]}
  };
  var lines=[], mode='';
  function layout(){
    var m=window.innerWidth<=700?'m':'d'; if(m===mode) return; mode=m;
    var L=LAY[m], W=L.W, H=L.H;
    chart.style.aspectRatio=W+'/'+H;
    NODES.forEach(function(n){ var g=L[n[0]], e=el[n[0]];
      e.style.left=g[0]/W*100+'%'; e.style.top=g[1]/H*100+'%'; e.style.width=g[2]/W*100+'%'; e.style.height=g[3]/H*100+'%'; });
    lines.forEach(function(l){ l.e.remove(); }); lines=[];
    function T(n){return L[n][1]-L[n][3]/2;} function B(n){return L[n][1]+L[n][3]/2;} function Lf(n){return L[n][0]-L[n][2]/2;} function R(n){return L[n][0]+L[n][2]/2;}
    function V(x,y1,y2,a,b){ add('v',x,y1,y2,a,b,0); }
    function Hh(y,x1,x2,a,b,dash,rev){ add('h',y,x1,x2,a,b,dash,rev); }
    function add(t,p,s,e,a,b,dash,rev){ var d=document.createElement('i'); d.className='st-ln'+(dash?' dd':'');
      if(t==='v'){ d.style.cssText='left:calc('+p/W*100+'% - 1px);top:'+s/H*100+'%;height:'+(e-s)/H*100+'%;width:2px;transform-origin:50% 0'; }
      else { d.style.cssText='top:calc('+p/H*100+'% - 1px);left:'+Math.min(s,e)/W*100+'%;width:'+Math.abs(e-s)/W*100+'%;height:2px;transform-origin:'+(rev?'100%':'0')+' 50%'; }
      chart.appendChild(d); lines.push({e:d,t:t,a:a,b:b}); }
    V(L.pb[0],B('pb'),T('kt'),.08,.16);
    Hh(L.kt[1],R('kt'),Lf('mk'),.22,.30,1);
    V(L.kt[0],B('kt'),T('wk'),.22,.28);
    Hh(L.wk[1],R('bn'),Lf('wk'),.34,.42,0,1);
    Hh(L.wk[1],R('wk'),Lf('sk'),.34,.42);
    V(L.wk[0],B('wk'),L.bus,.48,.54);
    var xs=[0,1,2,3,4].map(function(i){return L['d'+i][0];}), cx=L.wk[0];
    Hh(L.bus,Math.min.apply(0,xs),cx,.54,.64,0,1); Hh(L.bus,cx,Math.max.apply(0,xs),.54,.64);
    for(var i=0;i<5;i++) V(xs[i],L.bus,T('d'+i),.64,.72);
    if(root._c!==undefined) draw(root._c);
  }

  /* --- stepper + rincian departemen --- */
  var LB=['Struktur','Kaderisasi','Pembinaan','Kesejahteraan','Syiar','LSO'], sbtn=[];
  LB.forEach(function(t,i){ var b=document.createElement('button'); b.type='button'; b.className='st-s'; b.textContent=t; b.setAttribute('aria-label','Menuju '+t); steps.appendChild(b); sbtn.push(b); });
  var scs=[];
  D.forEach(function(d,i){
    var s=document.createElement('div'); s.className='st-sc';
    var ix=d.ix||('Departemen 0'+(i+1)+' / 04');
    s.innerHTML='<div><span class="st-ix st-it">'+esc(ix)+'</span><h3 class="st-nm st-it">'+esc(d.k)+'</h3><p class="st-ds st-it">'+esc(d.ds)+'</p></div>'+
      '<div><span class="st-lb st-it">'+(i<4?'Bidang':'Lembaga')+'</span><div class="st-grid">'+
      d.b.map(function(b){return '<div class="st-chip st-it">'+esc(b[0])+(b[1]?'<small>'+esc(b[1])+'</small>':'')+'</div>';}).join('')+
      '</div><span class="st-lb st-it">Program &amp; event</span><div class="st-pills">'+d.e.map(function(x){return '<span class="st-pill st-it">'+esc(x)+'</span>';}).join('')+'</div></div>';
    scWrap.appendChild(s); scs.push({el:s,it:[].slice.call(s.querySelectorAll('.st-it'))});
  });

  layout();
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ root.classList.add('st-static'); window.addEventListener('resize',layout); return; }

  /* Pastikan parent WordPress tidak memblokir position: sticky */
  var q=root.parentElement, n=0;
  while(q && q!==document.documentElement && n++<20){ var cs=getComputedStyle(q);
    if(/hidden|auto|scroll/.test(cs.overflow+cs.overflowX+cs.overflowY)) q.style.setProperty('overflow','visible','important'); q=q.parentElement; }

  var HOLD=.28, SP=(1-HOLD)/5, CH=.2;
  function clamp(x){return Math.max(0,Math.min(1,x));}
  function ease(t){return 1-Math.pow(1-t,3);}
  function draw(c){
    NODES.forEach(function(nd){ var v=ease(clamp((c-nd[4])/(nd[5]-nd[4]))), e=el[nd[0]];
      e.style.opacity=v.toFixed(3); e.style.transform='translate(-50%,-50%) scale('+(.85+.15*v).toFixed(3)+')'; });
    lines.forEach(function(l){ var v=clamp((c-l.a)/(l.b-l.a)); l.e.style.transform=l.t==='v'?'scaleY('+v+')':'scaleX('+v+')'; });
  }
  var ticking=false;
  function render(){
    ticking=false;
    var r=root.getBoundingClientRect(), d=r.height-window.innerHeight, p=d>0?clamp(-r.top/d):0;
    root._c=clamp(p/CH); draw(root._c);

    var co=1-clamp((p-(HOLD-.05))/.05);
    cl.style.opacity=co.toFixed(3); cl.style.transform='scale('+(1-(1-co)*.05).toFixed(3)+')'; cl.style.visibility=co<=0?'hidden':'visible';

    scs.forEach(function(s,i){
      var lp=(p-(HOLD+i*SP))/SP, vis=lp>-.02&&(i===4||lp<1.02);
      s.el.style.visibility=vis?'visible':'hidden';
      if(!vis) return;
      var o=clamp(lp/.07)*(i===4?1:1-clamp((lp-.92)/.08));
      s.el.style.opacity=o.toFixed(3);
      s.it.forEach(function(it,k){ var v=clamp((lp-.02-k*.017)/.09); it.style.opacity=v.toFixed(3); it.style.transform='translate3d(0,'+((1-v)*18).toFixed(1)+'px,0)'; });
    });

    var idx=p<HOLD?0:Math.min(5,1+Math.floor((p-HOLD)/SP)), pos=p<HOLD?clamp(p/HOLD)*.6:Math.min(5,idx+clamp((p-HOLD-(idx-1)*SP)/SP));
    sbtn.forEach(function(b,i){ b.classList.toggle('on',i===idx); b.classList.toggle('done',i<idx); });
    fill.style.width=((Math.min(pos,5)+.5)/6*100).toFixed(2)+'%';
  }
  function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(render); } }

  /* Klik langkah = lompat ke bagian itu */
  sbtn.forEach(function(b,i){ b.addEventListener('click',function(){
    var r=root.getBoundingClientRect(), top=window.pageYOffset+r.top, d=r.height-window.innerHeight;
    var p=i===0?.17:HOLD+(i-1)*SP+SP*.45; window.scrollTo({top:top+p*d,behavior:'smooth'}); }); });

  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',function(){ layout(); onScroll(); },{passive:true});
  window.addEventListener('load',render);
  render();
})();
</script>
